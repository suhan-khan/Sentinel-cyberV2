
services:
  - type: web
    name: sentinel-cyber-backend
    env: python
    region: oregon
    plan: free

    rootDir: backend

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SENTINEL_SENSOR_TOKEN
        generateValue: true

      - key: SENTINEL_MAX_UPLOAD_MB
        value: 50

      - key: SENTINEL_DECISION_THRESHOLD
        value: 0.05

      - key: CORS_ALLOW_ALL
        value: "false"

      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500"
